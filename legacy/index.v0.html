<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Damian Dobroliński</title>

  <meta
    name="description"
    content="Damian Dobroliński — Ludzie · Sprzedaż · Marketing · Technologia"
  >

  <meta name="theme-color" content="#080808">

  <style>

    /* ========================================
       RESET
       ======================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background: #080808;

      font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }


    /* ========================================
       STRONA
       ======================================== */

    .page {
      position: relative;

      width: 100%;
      height: 100svh;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #f7f7f5;

      background:
        linear-gradient(
          118deg,
          #070707 0%,
          #080808 32%,
          #0d0d0d 48%,
          #101010 52%,
          #0b0b0b 68%,
          #070707 100%
        );
    }


    /* ========================================
       SUBTELNE TŁO
       ======================================== */

    .page::before {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          115deg,
          transparent 0%,
          transparent 42%,
          rgba(255, 255, 255, 0.012) 48%,
          rgba(255, 255, 255, 0.028) 50%,
          rgba(255, 255, 255, 0.012) 52%,
          transparent 58%,
          transparent 100%
        );

      opacity: 0.7;
    }


    /* ========================================
       GŁÓWNA TREŚĆ
       ======================================== */

    .identity {
      position: relative;
      z-index: 2;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      opacity: 0;
      transform: translateY(8px);

      animation:
        identity-in
        900ms
        cubic-bezier(.22, 1, .36, 1)
        1150ms
        forwards;
    }


    /* ========================================
       NAZWISKO
       ======================================== */

    .name {
      color: #f7f7f5;

      font-size: clamp(2.3rem, 5vw, 4.8rem);
      line-height: 0.98;

      font-weight: 700;
      letter-spacing: -0.045em;
    }


    /* ========================================
       OBSZARY
       ======================================== */

    .areas {
      margin-top: 24px;

      color: rgba(255, 255, 255, 0.58);

      font-size: clamp(.9rem, 1.25vw, 1.12rem);
      line-height: 1.5;

      font-weight: 400;
      letter-spacing: .01em;
    }


    /* ========================================
       KONTAKT
       ======================================== */

    .contact {
      margin-top: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 12px;

      font-size: clamp(.82rem, 1vw, .96rem);
      font-weight: 500;
    }

    .contact a {
      position: relative;

      color: rgba(255, 255, 255, 0.88);

      text-decoration: none;

      transition:
        color 220ms ease,
        opacity 220ms ease;
    }

    .contact a::after {
      content: "";

      position: absolute;

      left: 0;
      bottom: -5px;

      width: 100%;
      height: 1px;

      background: rgba(255, 255, 255, 0.75);

      transform: scaleX(0);
      transform-origin: right;

      transition:
        transform
        300ms
        cubic-bezier(.22, 1, .36, 1);
    }

    .contact a:hover {
      color: #ffffff;
    }

    .contact a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .separator {
      color: rgba(255, 255, 255, 0.22);

      user-select: none;
    }


    /* ========================================
       POWERED BY DEMRISE
       ======================================== */

    .powered {
      position: absolute;

      z-index: 3;

      left: 50%;
      bottom: 30px;

      transform: translateX(-50%);

      opacity: 0;

      animation:
        powered-in
        800ms
        ease
        1800ms
        forwards;
    }

    .powered a {
      color: rgba(255, 255, 255, 0.27);

      text-decoration: none;

      font-size: .68rem;
      font-weight: 500;

      letter-spacing: .13em;
      text-transform: uppercase;

      transition:
        color 300ms ease,
        letter-spacing 400ms cubic-bezier(.22, 1, .36, 1);
    }

    .powered a:hover {
      color: rgba(255, 255, 255, 0.68);

      letter-spacing: .17em;
    }

    .powered strong {
      color: rgba(255, 255, 255, 0.44);

      font-weight: 700;
    }


    /* ========================================
       INTRO
       ======================================== */

    .intro {
      position: fixed;
      inset: 0;

      z-index: 10;

      pointer-events: none;
    }


    /* ========================================
       BIAŁE PŁASZCZYZNY
       ======================================== */

    .curtain {
      position: absolute;

      left: -30%;

      width: 160%;
      height: 160%;

      background: #f7f7f5;

      will-change: transform;

      animation-duration: 2100ms;

      /*
        Tylko 0,1 sekundy białej planszy.
        Potem od razu zaczyna się ruch.
      */
      animation-delay: 100ms;

      animation-timing-function:
        cubic-bezier(.76, 0, .24, 1);

      animation-fill-mode: forwards;
    }


    /* GÓRNA CZĘŚĆ */

    .curtain-top {
      top: -80%;

      transform:
        translateY(0)
        rotate(-4deg);

      animation-name: curtain-top-out;
    }


    /* DOLNA CZĘŚĆ */

    .curtain-bottom {
      bottom: -80%;

      transform:
        translateY(0)
        rotate(-4deg);

      animation-name: curtain-bottom-out;
    }


    /* ========================================
       LINIA CIĘCIA
       ======================================== */

    .cut-line {
      position: absolute;

      z-index: 12;

      top: 50%;
      left: -10%;

      width: 120%;
      height: 1px;

      background: rgba(0, 0, 0, 0.10);

      transform:
        rotate(-4deg)
        scaleX(0);

      transform-origin: center;

      opacity: 0;

      animation:
        line-in
        350ms
        ease
        50ms
        forwards,

        line-out
        500ms
        ease
        650ms
        forwards;
    }


    /* ========================================
       ANIMACJA OTWARCIA
       ======================================== */

    @keyframes curtain-top-out {

      0% {
        transform:
          translateY(0)
          rotate(-4deg);
      }

      100% {
        transform:
          translateY(-105%)
          rotate(-4deg);
      }

    }


    @keyframes curtain-bottom-out {

      0% {
        transform:
          translateY(0)
          rotate(-4deg);
      }

      100% {
        transform:
          translateY(105%)
          rotate(-4deg);
      }

    }


    /* ========================================
       ANIMACJA LINII
       ======================================== */

    @keyframes line-in {

      0% {
        opacity: 0;

        transform:
          rotate(-4deg)
          scaleX(0);
      }

      100% {
        opacity: 1;

        transform:
          rotate(-4deg)
          scaleX(1);
      }

    }


    @keyframes line-out {

      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }

    }


    /* ========================================
       POJAWIENIE SIĘ TREŚCI
       ======================================== */

    @keyframes identity-in {

      from {
        opacity: 0;

        transform:
          translateY(8px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }

    }


    /* ========================================
       DEMRISE
       ======================================== */

    @keyframes powered-in {

      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }

    }


    /* ========================================
       MOBILE
       ======================================== */

    @media (max-width: 640px) {

      .identity {
        width: calc(100% - 40px);
      }

      .name {
        font-size: clamp(2.2rem, 11vw, 3.4rem);

        line-height: 1;
      }

      .areas {
        margin-top: 20px;

        max-width: 320px;

        font-size: .88rem;
        line-height: 1.7;
      }

      .contact {
        margin-top: 30px;

        flex-direction: column;

        gap: 9px;

        font-size: .86rem;
      }

      .separator {
        display: none;
      }

      .powered {
        bottom: 22px;
      }

      .curtain {
        width: 190%;

        left: -45%;
      }

    }


    /* ========================================
       REDUCED MOTION
       ======================================== */

    @media (prefers-reduced-motion: reduce) {

      .curtain,
      .cut-line,
      .identity,
      .powered {
        animation: none !important;
      }

      .intro {
        display: none;
      }

      .identity,
      .powered {
        opacity: 1;

        transform: none;
      }

    }

  </style>
</head>


<body>

  <main class="page">

    <section class="identity">

      <h1 class="name">
        Damian Dobroliński
      </h1>

      <p class="areas">
        Ludzie · Sprzedaż · Marketing · Technologia
      </p>

      <div class="contact">

        <a href="mailto:damian@dobrolinski.pl">
          damian@dobrolinski.pl
        </a>

        <span class="separator">
          ·
        </span>

        <a href="tel:+48538531888">
          538 531 888
        </a>

      </div>

    </section>


    <div class="powered">

      <a
        href="https://demrise.pl"
        target="_blank"
        rel="noopener noreferrer"
      >
        Powered by <strong>DEMRISE</strong>
      </a>

    </div>

  </main>


  <!-- BIAŁE OTWARCIE -->

  <div
    class="intro"
    aria-hidden="true"
  >

    <div class="curtain curtain-top"></div>

    <div class="cut-line"></div>

    <div class="curtain curtain-bottom"></div>

  </div>

</body>
</html>
