<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0b">

  <title>Damian Dobroliński</title>
  <meta
    name="description"
    content="Damian Dobroliński — Ludzie, Sprzedaż, Marketing, Technologia."
  >

  <style>
    :root {
      --bg: #0a0a0b;
      --text: #f5f5f3;
      --muted: rgba(245, 245, 243, .58);
      --soft: rgba(255, 255, 255, .035);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow: hidden;
    }

    /* ===== STRONA ===== */

    .page {
      position: relative;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 40px 24px;
      background:
        radial-gradient(
          circle at 50% 48%,
          rgba(255,255,255,.065) 0%,
          rgba(255,255,255,.025) 18%,
          rgba(255,255,255,0) 46%
        ),
        radial-gradient(
          circle at 75% 20%,
          rgba(255,255,255,.025),
          transparent 30%
        ),
        #0a0a0b;
    }

    /* ===== SUBTELNE D W TLE ===== */

    .background-mark {
      position: absolute;
      top: 50%;
      left: 50%;

      width: min(72vw, 920px);
      height: min(72vw, 920px);

      transform:
        translate(-50%, -50%)
        rotate(-8deg);

      opacity: .7;
      pointer-events: none;
    }

    .background-mark::before {
      content: "";
      position: absolute;
      inset: 8%;

      border: 1px solid rgba(255,255,255,.035);
      border-radius: 50%;
    }

    .background-mark::after {
      content: "";
      position: absolute;

      width: 42%;
      height: 78%;

      top: 2%;
      left: 49%;

      border-left: 1px solid rgba(255,255,255,.04);
      border-bottom: 1px solid rgba(255,255,255,.025);

      border-bottom-left-radius: 50%;

      transform: rotate(18deg);
    }

    /* ===== ZIARNO ===== */

    .noise {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .022;
      z-index: 2;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
    }

    /* ===== TREŚĆ ===== */

    .identity {
      position: relative;
      z-index: 4;
      text-align: center;

      opacity: 0;
      transform: translateY(14px);

      animation:
        identity-in 900ms
        cubic-bezier(.22, 1, .36, 1)
        1050ms forwards;
    }

    .name {
      margin: 0;

      color: var(--text);

      font-size: clamp(34px, 4vw, 58px);
      font-weight: 700;
      line-height: .98;

      letter-spacing: -.045em;
    }

    .areas {
      margin: 22px 0 0;

      color: var(--muted);

      font-size: clamp(13px, 1.2vw, 17px);
      font-weight: 400;
      line-height: 1.5;

      letter-spacing: .025em;
    }

    .email {
      display: inline-block;
      position: relative;

      margin-top: 32px;

      color: rgba(255,255,255,.88);

      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;

      letter-spacing: .01em;

      text-decoration: none;

      transition:
        color 220ms ease,
        transform 220ms ease;
    }

    .email::after {
      content: "";

      position: absolute;
      left: 0;
      right: 100%;
      bottom: -5px;

      height: 1px;

      background: rgba(255,255,255,.65);

      transition: right 300ms
        cubic-bezier(.22, 1, .36, 1);
    }

    .email:hover {
      color: #fff;
      transform: translateY(-1px);
    }

    .email:hover::after {
      right: 0;
    }

    /* =================================
       INTRO — UKOŚNE OTWARCIE
       ================================= */

    .intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
    }

    .curtain {
      position: absolute;

      width: 150%;
      height: 150%;

      left: -25%;

      background: #f7f7f5;

      will-change: transform;

      animation-duration: 1250ms;
      animation-delay: 320ms;

      animation-timing-function:
        cubic-bezier(.76, 0, .24, 1);

      animation-fill-mode: forwards;
    }

    /*
      Dwie powierzchnie nachodzą na siebie.
      Dzięki temu przy starcie ekran jest
      całkowicie biały.
    */

    .curtain-top {
      top: -75%;

      transform: rotate(-8deg);

      animation-name: curtain-top-out;
    }

    .curtain-bottom {
      bottom: -75%;

      transform: rotate(-8deg);

      animation-name: curtain-bottom-out;
    }

    /* delikatna linia pojawiająca się
       dokładnie przy otwieraniu */

    .cut-line {
      position: absolute;

      top: 50%;
      left: -10%;

      width: 120%;
      height: 1px;

      background: rgba(0,0,0,.15);

      transform:
        rotate(-8deg)
        scaleX(0);

      transform-origin: center;

      opacity: 0;

      animation:
        line-in 500ms ease 180ms forwards,
        line-out 400ms ease 750ms forwards;
    }

    /* ===== ANIMACJE ===== */

    @keyframes curtain-top-out {
      from {
        transform:
          translateY(0)
          rotate(-8deg);
      }

      to {
        transform:
          translateY(-105%)
          rotate(-8deg);
      }
    }

    @keyframes curtain-bottom-out {
      from {
        transform:
          translateY(0)
          rotate(-8deg);
      }

      to {
        transform:
          translateY(105%)
          rotate(-8deg);
      }
    }

    @keyframes line-in {
      from {
        opacity: 0;
        transform:
          rotate(-8deg)
          scaleX(0);
      }

      to {
        opacity: 1;
        transform:
          rotate(-8deg)
          scaleX(1);
      }
    }

    @keyframes line-out {
      to {
        opacity: 0;
      }
    }

    @keyframes identity-in {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== MOBILE ===== */

    @media (max-width: 600px) {

      .page {
        padding: 32px 22px;
      }

      .name {
        font-size: clamp(34px, 10vw, 46px);
      }

      .areas {
        max-width: 310px;
        margin-left: auto;
        margin-right: auto;
        margin-top: 20px;

        line-height: 1.7;
      }

      .email {
        margin-top: 28px;
      }

      .background-mark {
        width: 120vw;
        height: 120vw;
      }

      .curtain-top,
      .curtain-bottom {
        transform: rotate(-12deg);
      }

      @keyframes curtain-top-out {
        from {
          transform:
            translateY(0)
            rotate(-12deg);
        }

        to {
          transform:
            translateY(-105%)
            rotate(-12deg);
        }
      }

      @keyframes curtain-bottom-out {
        from {
          transform:
            translateY(0)
            rotate(-12deg);
        }

        to {
          transform:
            translateY(105%)
            rotate(-12deg);
        }
      }
    }

    /* ===== ACCESSIBILITY ===== */

    @media (prefers-reduced-motion: reduce) {

      .intro {
        display: none;
      }

      .identity {
        opacity: 1;
        transform: none;
        animation: none;
      }
    }

  </style>
</head>

<body>

  <main class="page">

    <div
      class="background-mark"
      aria-hidden="true">
    </div>

    <div
      class="noise"
      aria-hidden="true">
    </div>

    <section
      class="identity"
      aria-label="Damian Dobroliński">

      <h1 class="name">
        Damian Dobroliński
      </h1>

      <p class="areas">
        Ludzie · Sprzedaż · Marketing · Technologia
      </p>

      <a
        class="email"
        href="mailto:damian@dobrolinski.pl">
        damian@dobrolinski.pl
      </a>

    </section>

  </main>

  <div
    class="intro"
    aria-hidden="true">

    <div class="curtain curtain-top"></div>
    <div class="curtain curtain-bottom"></div>
    <div class="cut-line"></div>

  </div>

</body>
</html>
