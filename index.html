<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Damian Dobroliński</title>

  <meta
    name="description"
    content="Damian Dobroliński — Ludzie · Sprzedaż · Marketing · Technologia"
  >

  <meta name="theme-color" content="#080808">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background: #080808;
      font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* =========================
       GŁÓWNA STRONA
       ========================= */

    .page {
      position: relative;
      width: 100%;
      height: 100svh;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          118deg,
          #070707 0%,
          #090909 35%,
          #101010 51%,
          #090909 67%,
          #070707 100%
        );

      color: #f5f5f3;
    }

    /* bardzo subtelna faktura */
    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;

      background-image:
        linear-gradient(
          115deg,
          transparent 0%,
          rgba(255,255,255,.018) 48%,
          rgba(255,255,255,.035) 50%,
          rgba(255,255,255,.018) 52%,
          transparent 100%
        );

      opacity: .7;
    }

    /* =========================
       TREŚĆ
       ========================= */

    .identity {
      position: relative;
      z-index: 2;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      opacity: 0;
      transform: translateY(8px);

      animation:
        identity-in
        1200ms
        cubic-bezier(.22, 1, .36, 1)
        1850ms
        forwards;
    }

    .name {
      font-size: clamp(2.3rem, 5vw, 4.8rem);
      line-height: .98;

      font-weight: 700;
      letter-spacing: -0.045em;

      color: #f7f7f5;
    }

    .areas {
      margin-top: 24px;

      font-size: clamp(.9rem, 1.25vw, 1.12rem);
      line-height: 1.5;

      font-weight: 400;
      letter-spacing: .01em;

      color: rgba(255,255,255,.62);
    }

    .contact {
      margin-top: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 12px;

      font-size: clamp(.82rem, 1vw, .96rem);
      font-weight: 500;
    }

    .contact a {
      position: relative;

      color: rgba(255,255,255,.88);
      text-decoration: none;

      transition:
        color 220ms ease,
        opacity 220ms ease;
    }

    .contact a::after {
      content: "";
      position: absolute;

      left: 0;
      bottom: -5px;

      width: 100%;
      height: 1px;

      background: rgba(255,255,255,.75);

      transform: scaleX(0);
      transform-origin: right;

      transition:
        transform 300ms
        cubic-bezier(.22, 1, .36, 1);
    }

    .contact a:hover {
      color: #fff;
    }

    .contact a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .separator {
      color: rgba(255,255,255,.22);
      user-select: none;
    }

    /* =========================
       DEMRISE
       ========================= */

    .powered {
      position: absolute;

      z-index: 3;

      left: 50%;
      bottom: 30px;

      transform: translateX(-50%);

      opacity: 0;

      animation:
        powered-in
        1000ms
        ease
        2600ms
        forwards;
    }

    .powered a {
      color: rgba(255,255,255,.28);
      text-decoration: none;

      font-size: .68rem;
      font-weight: 500;

      letter-spacing: .13em;
      text-transform: uppercase;

      transition: color 250ms ease;
    }

    .powered a:hover {
      color: rgba(255,255,255,.7);
    }

    .powered strong {
      font-weight: 700;
      color: rgba(255,255,255,.43);
    }

    /* =========================
       BIAŁE OTWARCIE
       ========================= */

    .intro {
      position: fixed;
      inset: 0;

      z-index: 10;

      pointer-events: none;
    }

    .curtain {
      position: absolute;

      left: -30%;

      width: 160%;
      height: 160%;

      background: #f7f7f5;

      will-change: transform;

      animation-duration: 2300ms;
      animation-delay: 450ms;

      animation-timing-function:
        cubic-bezier(.77, 0, .18, 1);

      animation-fill-mode: forwards;
    }

    .curtain-top {
      top: -80%;

      transform:
        translateY(0)
        rotate(-4deg);

      animation-name: curtain-top-out;
    }

    .curtain-bottom {
      bottom: -80%;

      transform:
        translateY(0)
        rotate(-4deg);

      animation-name: curtain-bottom-out;
    }

    /* subtelna linia cięcia */
    .cut-line {
      position: absolute;

      z-index: 12;

      top: 50%;
      left: -10%;

      width: 120%;
      height: 1px;

      background: rgba(0,0,0,.10);

      transform:
        rotate(-4deg)
        scaleX(0);

      transform-origin: center;

      opacity: 0;

      animation:
        line-in 900ms ease 250ms forwards,
        line-out 700ms ease 1250ms forwards;
    }

    /* =========================
       ANIMACJE
       ========================= */

    @keyframes curtain-top-out {
      0% {
        transform:
          translateY(0)
          rotate(-4deg);
      }

      20% {
        transform:
          translateY(-2%)
          rotate(-4deg);
      }

      100% {
        transform:
          translateY(-105%)
          rotate(-4deg);
      }
    }

    @keyframes curtain-bottom-out {
      0% {
        transform:
          translateY(0)
          rotate(-4deg);
      }

      20% {
        transform:
          translateY(2%)
          rotate(-4deg);
      }

      100% {
        transform:
          translateY(105%)
          rotate(-4deg);
      }
    }

    @keyframes line-in {
      0% {
        opacity: 0;
        transform:
          rotate(-4deg)
          scaleX(0);
      }

      100% {
        opacity: 1;
        transform:
          rotate(-4deg)
          scaleX(1);
      }
    }

    @keyframes line-out {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    @keyframes identity-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes powered-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 640px) {

      .identity {
        width: calc(100% - 40px);
      }

      .name {
        font-size: clamp(2.2rem, 11vw, 3.4rem);
      }

      .areas {
        margin-top: 20px;

        max-width: 320px;

        font-size: .88rem;
        line-height: 1.7;
      }

      .contact {
        margin-top: 30px;

        flex-direction: column;
        gap: 9px;

        font-size: .86rem;
      }

      .separator {
        display: none;
      }

      .powered {
        bottom: 22px;
      }

      .curtain {
        width: 190%;
        left: -45%;
      }
    }

    /* =========================
       ACCESSIBILITY
       ========================= */

    @media (prefers-reduced-motion: reduce) {

      .curtain,
      .cut-line,
      .identity,
      .powered {
        animation: none !important;
      }

      .intro {
        display: none;
      }

      .identity,
      .powered {
        opacity: 1;
        transform: none;
      }
    }

  </style>
</head>

<body>

  <main class="page">

    <section class="identity">

      <h1 class="name">
        Damian Dobroliński
      </h1>

      <p class="areas">
        Ludzie · Sprzedaż · Marketing · Technologia
      </p>

      <div class="contact">

        <a href="mailto:damian@dobrolinski.pl">
          damian@dobrolinski.pl
        </a>

        <span class="separator">·</span>

        <a href="tel:+48538531888">
          538 531 888
        </a>

      </div>

    </section>

    <div class="powered">
      <a
        href="https://demrise.pl"
        target="_blank"
        rel="noopener noreferrer"
      >
        Powered by <strong>DEMRISE</strong>
      </a>
    </div>

  </main>

  <div class="intro" aria-hidden="true">

    <div class="curtain curtain-top"></div>

    <div class="cut-line"></div>

    <div class="curtain curtain-bottom"></div>

  </div>

</body>
</html>
