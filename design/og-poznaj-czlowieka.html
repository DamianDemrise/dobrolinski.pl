<!doctype html>
<!--
  Źródło grafiki Open Graph dla /poznaj-czlowieka (1200 × 630).
  Render: Chrome headless, okno 1200×630, skala 1, zapis do public/og-poznaj-czlowieka.png.
  Język wizualny jak na stronie: prawie czarne tło, delikatne światło, Helvetica Neue.
-->
<html lang="pl">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(ellipse 46% 78% at 80% 38%, rgba(255, 255, 255, 0.075), transparent 70%),
      linear-gradient(118deg, #070707 0%, #080808 32%, #0d0d0d 48%, #101010 52%, #0b0b0b 68%, #070707 100%);
    color: #f7f7f5;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .frame {
    position: absolute;
    inset: 96px 96px 84px 96px;
    display: flex;
    flex-direction: column;
  }
  .eyebrow {
    color: rgba(255, 255, 255, 0.78);
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 0.16em;
  }
  h1 {
    margin: 30px 0 0;
    font-size: 82px;
    font-weight: 700;
    letter-spacing: -0.045em;
    line-height: 1;
  }
  h1 span { display: block; white-space: nowrap; }
  .rule {
    width: 56px;
    height: 2px;
    margin: 34px 0 28px;
    background: rgba(255, 255, 255, 0.7);
  }
  .lead {
    color: rgba(255, 255, 255, 0.74);
    font-size: 31px;
    line-height: 1.3;
  }
  .author {
    margin-top: auto;
    color: rgba(255, 255, 255, 0.55);
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.16em;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="eyebrow">01 / POZNAJ CZŁOWIEKA</div>
    <h1><span>Na końcu każdej</span><span>sprzedaży jest człowiek.</span></h1>
    <div class="rule"></div>
    <div class="lead">Warsztat o sprzedaży, relacjach i pracy z ludźmi.</div>
    <div class="author">DAMIAN DOBROLIŃSKI / DOBROLINSKI.PL</div>
  </div>
</body>
</html>
