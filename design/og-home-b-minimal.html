<!doctype html><html lang="pl"><head><meta charset="utf-8"><style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body {
  position: relative;
  /* Tło 1:1 z hero dobrolinski.pl (.site-stage + .ambient-light w spoczynku). */
  background: linear-gradient(118deg, #070707 0%, #080808 32%, #0d0d0d 48%, #101010 52%, #0b0b0b 68%, #070707 100%);
  color: #f7f7f5;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.ambient {
  position: absolute; inset: 0; opacity: 0.78;
  background: radial-gradient(38rem circle at 50% 42%, rgba(255,255,255,0.052), rgba(255,255,255,0.018) 25%, transparent 64%);
}
.name { margin: 0; color: #f7f7f5; font-weight: 700; letter-spacing: -0.055em; line-height: 0.95; }
.name span { display: block; }
.areas { color: rgba(255,255,255,0.66); font-weight: 400; white-space: nowrap; }
.areas i { font-style: normal; color: rgba(255,255,255,0.3); margin: 0 0.34em; }
.thought { color: rgba(255,255,255,0.79); font-weight: 400; letter-spacing: -0.015em; line-height: 1.3; }
.domain { color: rgba(255,255,255,0.48); font-weight: 400; letter-spacing: 0.01em; }

.wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 20px; }
.name { font-size: 104px; }
.areas { margin-top: 30px; font-size: 28px; }
.thought { margin-top: 42px; font-size: 25px; }
.domain { position: absolute; left: 0; right: 0; bottom: 56px; text-align: center; font-size: 20px; }
</style></head>
<body><div class="ambient"></div>
<div class="wrap">
  <h1 class="name">Damian Dobroliński</h1>
  <div class="areas">Ludzie<i>·</i>Sprzedaż<i>·</i>Marketing<i>·</i>Technologia</div>
  <p class="thought">Na końcu każdej sprzedaży jest człowiek.</p>
</div>
<div class="domain">dobrolinski.pl</div>
</body></html>
