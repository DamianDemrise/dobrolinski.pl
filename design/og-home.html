<!doctype html>
<!--
  PROPOZYCJA grafiki Open Graph dla strony głównej (1200 × 630), do akceptacji.
  Nie jest podpięta pod meta tagi. Render jak og-poznaj-czlowieka.html.
-->
<html lang="pl">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(ellipse 52% 80% at 30% 52%, rgba(255, 255, 255, 0.07), transparent 70%),
      linear-gradient(118deg, #070707 0%, #080808 32%, #0d0d0d 48%, #101010 52%, #0b0b0b 68%, #070707 100%);
    color: #f7f7f5;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .frame { position: absolute; inset: 88px 96px 80px 96px; }
  .areas {
    color: rgba(255, 255, 255, 0.74);
    font-size: 23px;
    font-weight: 600;
    letter-spacing: 0.16em;
  }
  h1 {
    position: absolute;
    top: 74px;
    left: -6px;
    margin: 0;
    font-size: 150px;
    font-weight: 700;
    letter-spacing: -0.06em;
    line-height: 0.9;
  }
  h1 span { display: block; }
  .thought {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 420px;
    color: rgba(255, 255, 255, 0.82);
    font-size: 32px;
    font-weight: 500;
    letter-spacing: -0.015em;
    line-height: 1.25;
  }
  .rule {
    width: 48px;
    height: 2px;
    margin-bottom: 22px;
    background: rgba(255, 255, 255, 0.7);
  }
  .domain {
    position: absolute;
    left: 0;
    bottom: 4px;
    color: rgba(255, 255, 255, 0.55);
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.16em;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="areas">LUDZIE · SPRZEDAŻ · MARKETING · TECHNOLOGIA</div>
    <h1><span>Damian</span><span>Dobroliński</span></h1>
    <div class="thought"><div class="rule"></div>Na końcu każdej sprzedaży jest człowiek.</div>
    <div class="domain">DOBROLINSKI.PL</div>
  </div>
</body>
</html>
